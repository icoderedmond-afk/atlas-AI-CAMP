<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idex.html — Expanded Unique Scroll Edition</title>
    <style>
        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #102a43;
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #0056b3;
            color: #ffffff;
            width: 100%;
            padding: 60px;
            text-align: left;
            border-bottom: 4px solid #003d82;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 3.8rem;
            letter-spacing: 1px;
        }

        header p {
            margin: 10px 0 0;
            color: #d0e1fd;
            font-size: 1.4rem;
        }

        .scroll-container {
            width: 100%;
            flex: 1;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            gap: 80px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .section-block {
            width: 100%;
            background: #ffffff;
            border: 2px solid #b9d2e8;
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 6px 16px rgba(0,86,179,0.06);
        }

        .section-header {
            border-bottom: 3px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 40px;
        }

        .section-header h2 {
            margin: 0 0 10px 0;
            font-size: 3rem;
            color: #003d82;
        }

        .subtitle {
            margin: 0;
            font-size: 1.35rem;
            color: #334e68;
        }

        /* Perfect Circle Fun Fact */
        .circle-box {
            width: 220px;
            height: 220px;
            background: #0056b3;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            box-shadow: 0 6px 15px rgba(0,86,179,0.25);
            margin: 20px auto;
            border: 4px solid #e1ecf8;
            flex-shrink: 0;
        }

        .circle-box h4 {
            margin: 0 0 6px 0;
            font-size: 1.15rem;
            color: #d0e1fd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .circle-box p {
            margin: 0;
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.35;
        }

        .info-box {
            background: #f8fbff;
            border: 1px solid #b9d2e8;
            border-left: 8px solid #0056b3;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,86,179,0.04);
        }

        .info-box h3 {
            margin: 0 0 12px 0;
            font-size: 1.4rem;
            color: #0056b3;
        }

        .info-box p, .info-box ul {
            margin: 0;
            font-size: 1.05rem;
            color: #243b53;
            line-height: 1.6;
        }

        .info-box ul {
            padding-left: 20px;
        }

        .info-box li {
            margin-bottom: 8px;
        }

        /* Unique Layout 1: Brain */
        .layout-brain {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 35px;
            align-items: start;
        }
        .brain-sidebar, .brain-main {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Unique Layout 2: Motors */
        .motor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 25px;
        }
        .motor-bottom {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 25px;
            align-items: center;
        }

        /* Unique Layout 3: BaseBot */
        .basebot-flow {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .basebot-top-row {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 25px;
            align-items: center;
        }
        .step-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
