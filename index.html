<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idex.html</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #f0f0f0;
            width: 100%;
            padding: 30px 60px;
            text-align: left;
            border-bottom: 2px solid #ccc;
        }

        header h1 {
            margin: 0;
            font-size: 3.2rem;
            color: #111;
        }

        header p {
            margin: 10px 0 0;
            color: #555;
            font-size: 1.3rem;
        }

        .tab-container {
            width: 100%;
            flex: 1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tab-content {
            display: none;
            width: 100%;
        }

        .tab-content.active {
            display: block;
        }

        .tab-header {
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 35px;
            width: 100%;
        }

        .tab-content h2 {
            margin: 0 0 10px 0;
            font-size: 3rem;
            color: #000;
        }

        .subtitle {
            margin: 0;
            font-size: 1.4rem;
            color: #444;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            align-items: stretch;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .image-placeholder {
            width: 100%;
            height: 280px;
            background: #fafafa;
            border: 3px dashed #999;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .image-placeholder span {
            color: #555;
            font-size: 1rem;
            margin-top: 10px;
        }
