<html lang="en">
<head>

    <title>idex.html</title>
    <style>
        body {

            background-color: #050505;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #0ff0fc;
            text-shadow: 0 0 10px #0ff0fc, 0 0 20px #ff00ff;
            font-size: 2.2rem;
            margin: 0;
        }

        header p {
            color: #39ff14;
            text-shadow: 0 0 8px #39ff14;
            margin-top: 5px;
        }

        .tab-container {
            width: 100%;
            max-width: 850px;
            background: #111;
            border: 2px solid #ff00ff;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 0 25px rgba(191, 0, 255, 0.4);
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-header {
            border-bottom: 1px dashed #39ff14;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .tab-content h2 {
            color: #0ff0fc;
            text-shadow: 0 0 8px #0ff0fc;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #ff007f;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.5);
            margin: 0;
            font-size: 0.95rem;
        }

        .layout-grid {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .image-placeholder {
            flex: 1;
            min-width: 250px;
            height: 220px;
            background: #050505;
            border: 2px solid #39ff14;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        .image-placeholder span {
            color: #39ff14;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .info-sections {
            flex: 1.5;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.4);
            border-left: 3px solid #ff00ff;
            padding: 12px 15px;
            border-radius: 0 6px 6px 0;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.1);
        }

        .info-box h3 {
            color: #ff00ff;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
            margin: 0 0 5px 0;
            font-size: 1rem;
        }

        .info-box p, .info-box ul {
            margin: 0;
            font-size: 0.9rem;
            color: #ddd;
        }

        .info-box ul {
            padding-left: 15px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-top: 1px solid #222;
            padding-top: 20px;
        }
